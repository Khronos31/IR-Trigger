name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify tag and release metadata
        run: python tools/scripts/release_version.py check --tag "$GITHUB_REF_NAME"
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: brands

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  release:
    needs:
      - tests
      - validate-hacs
      - validate-hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify tag and release metadata
        run: python tools/scripts/release_version.py check --tag "$GITHUB_REF_NAME"
      - name: Build HACS artifact
        run: |
          cd custom_components/ir_trigger
          zip -9 -r ../../../ir_trigger.zip . -x '__pycache__/*' '*.pyc'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ir_trigger.zip --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
